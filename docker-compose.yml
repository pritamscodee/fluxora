name: fluxora

# Object storage for development. Both services below speak the same S3 API on
# localhost:9000 with the same credentials, so `S3_*` configuration is identical either
# way and the application cannot tell them apart.
#
#   docker compose up -d                      -> SeaweedFS (default)
#   docker compose --profile minio up -d      -> MinIO instead
#
# MinIO is behind a profile because its images are no longer publicly pullable from
# Docker Hub or quay.io; use it once you have registry access (`docker login`).

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: fluxora-s3
    # One process running master, volume, filer and the S3 gateway. The gateway listens
    # on 8333 and is published as 9000 so the endpoint matches the MinIO profile.
    command: >
      server
      -dir=/data
      -master.volumeSizeLimitMB=4096
      -volume.max=0
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9000:8333"   # S3 API
      - "9333:9333"   # master UI
      - "8888:8888"   # filer
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # SeaweedFS binds the container's own IP rather than loopback, so probing
      # `localhost` here gets connection-refused even while the gateway is serving
      # traffic normally. `$$(hostname)` resolves to that interface ($$ escapes compose
      # interpolation). The master's cluster status is used because the S3 port answers
      # 403 to an unsigned request, which is indistinguishable from a real failure.
      test:
        ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://$$(hostname):9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  minio:
    profiles: ["minio"]
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: fluxora-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-fluxora}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-fluxora-dev-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fluxora-redis
    # BullMQ needs keyspace notifications for delayed and stalled job handling, and
    # `noeviction` because evicting a queue key would silently drop in-flight jobs.
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
      --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

volumes:
  s3-data:
  minio-data:
  redis-data:
