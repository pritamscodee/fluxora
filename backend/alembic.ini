[alembic]
script_location = migrations
prepend_sys_path = .
# The URL is read from DATABASE_URL in migrations/env.py, never hardcoded here.
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# `exec` rather than `console_scripts`: ruff ships a standalone binary and does not
# expose a console_scripts entry point for Alembic to resolve.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
