[pytest]
asyncio_mode = auto
# Async fixtures share the test's own event loop. Anything that opens a long-lived
# connection (the BullMQ worker, Redis) must live on the same loop as the test body,
# or the worker's loop is simply not running while the test awaits a result.
asyncio_default_fixture_loop_scope = function
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:jose.*
